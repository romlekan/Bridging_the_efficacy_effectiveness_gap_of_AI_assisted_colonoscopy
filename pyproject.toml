[build-system]
requires = ["setuptools==67.8.0", "wheel==0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colonoscopy-fidelity-analysis"
version = "1.0.0"
requires-python = "==3.9.*"
dependencies = [
  "numpy==1.24.4",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "scikit-learn==1.2.2",
  "statsmodels==0.13.5",
  "patsy==0.5.3",
  "PyYAML==6.0",
  "torch==2.0.1",
  "click==8.1.3"
]

[project.scripts]
colonoscopy-analysis = "colonoscopy_fidelity.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
